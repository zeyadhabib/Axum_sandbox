[package]
name = "axum_sandbox"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
axum = "0.8"
axum-server = { version = "0.8", features = ["openssl", "tls-openssl", "tls-rustls"] }
bcrypt = "0.18"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
openssl = "0.10"
rustls = "0.23.37"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# rustls-extra = "0.15.0"
tokio = { version = "1.49.0", features = ["full"] }
